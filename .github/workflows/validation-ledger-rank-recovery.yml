name: Validation only - durable ledger source rank recovery

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "tools/test_ledger_rank_recovery_regression.py"
      - ".github/workflows/validation-ledger-rank-recovery.yml"
      - "constraint-runtime/src/hydra_constraint/persistence.py"

permissions:
  contents: read

jobs:
  ledger-rank-recovery:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Preserve committed bytes on Windows
        run: git config --global core.autocrlf false

      - name: Checkout exact isolated candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Record complete exact source snapshot
        run: python -I -B tools/test_ledger_rank_recovery_regression.py before

      - name: Compare four durable rank recovery cases without network
        run: python -I -B tools/test_ledger_rank_recovery_regression.py run

      - name: Verify complete source snapshot is unchanged
        if: always()
        run: python -I -B tools/test_ledger_rank_recovery_regression.py after
