name: NYX PR146 exact candidate diff check

on:
  push:
    branches:
      - nyx/validation-main7fb-pr146-diffcheck-harness-20261003

permissions:
  contents: read

jobs:
  diff-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 77f976d8ccec9316ab41d1909a0fbcf4be76e08d
          fetch-depth: 0
      - name: Bind exact candidate and run git diff check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $head = (git rev-parse HEAD).Trim()
          $tree = (git rev-parse 'HEAD^{tree}').Trim()
          if ($head -ne '77f976d8ccec9316ab41d1909a0fbcf4be76e08d') { throw "candidate head drift: $head" }
          if ($tree -ne '4fe9cf601a2953eb3968fec40e48f9f981938965') { throw "candidate tree drift: $tree" }
          git diff --check 7fb3934cc17505418cd7cc5d492874b39c3404ab 77f976d8ccec9316ab41d1909a0fbcf4be76e08d
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $paths = @(git diff --name-only 7fb3934cc17505418cd7cc5d492874b39c3404ab 77f976d8ccec9316ab41d1909a0fbcf4be76e08d)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($paths.Count -ne 3) { throw "unexpected changed path count: $($paths.Count)" }
          'PR146_EXACT_CANDIDATE_GIT_DIFF_CHECK=PASS'
          "CANDIDATE_HEAD=$head"
          "CANDIDATE_TREE=$tree"
