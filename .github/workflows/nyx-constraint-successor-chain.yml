name: NYX Constraint successor-chain guard

on:
  pull_request:
    paths:
      - "docs/constraint/**"
      - "constraint-t1-raw-artifact-store/**"
      - "t6-fail-closed-validator/**"
      - "tools/nyx_validate_constraint_successor_chain.py"
      - "tools/nyx_test_constraint_successor_chain_adversarial.py"
      - ".github/workflows/nyx-constraint-successor-chain.yml"
  push:
    branches:
      - main
    paths:
      - "docs/constraint/**"
      - "constraint-t1-raw-artifact-store/**"
      - "t6-fail-closed-validator/**"
      - "tools/nyx_validate_constraint_successor_chain.py"
      - "tools/nyx_test_constraint_successor_chain_adversarial.py"
      - ".github/workflows/nyx-constraint-successor-chain.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Validate successor-chain invariants
        run: python tools/nyx_validate_constraint_successor_chain.py

      - name: Run hostile successor-chain mutation matrix
        run: python tools/nyx_test_constraint_successor_chain_adversarial.py
