name: AWS market data deploy and verify

on:
  workflow_dispatch:
    inputs:
      aws_region:
        description: AWS region for the temporary public sample stack
        required: true
        default: us-east-1
        type: string
      stack_name:
        description: Per-run stack name based on the reserved HYDRA demo prefix
        required: true
        default: hydra-public-market-pipeline-demo-20261007
        type: string
      teardown:
        description: Empty buckets and delete the stack after verification
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: hydra-aws-market-data-demo
  cancel-in-progress: false

jobs:
  deploy-and-verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: aws-demo
    env:
      AWS_REGION: ${{ inputs.aws_region }}
      STACK_NAME: ${{ inputs.stack_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      SAMPLE_DIR: aws-market-data-pipeline
      DEPLOYMENT_RUN_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Validate deployment target
        run: |
          set -euo pipefail
          if [[ ! "$STACK_NAME" =~ ^hydra-public-market-pipeline-demo-[a-z0-9-]{1,64}$ ]]; then
            echo "Stack name must use the reserved hydra-public-market-pipeline-demo- prefix and a lowercase suffix." >&2
            exit 1
          fi

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ inputs.aws_region }}
          mask-aws-account-id: true
          role-to-assume: ${{ secrets.AWS_DEMO_ROLE_ARN }}
          role-session-name: hydra-public-aws-proof

      - name: Refuse to modify an existing stack
        run: |
          set -euo pipefail
          set +e
          description=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" 2>&1)
          status=$?
          set -e
          if [[ "$status" -eq 0 ]]; then
            echo "Refusing to update or delete an existing stack." >&2
            exit 1
          fi
          if [[ "$description" != *"does not exist"* ]]; then
            printf '%s\n' "$description" >&2
            exit "$status"
          fi

      - name: Set up AWS SAM
        uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3

      - name: Validate and build
        run: |
          sam validate --template "$SAMPLE_DIR/template.json"
          sam build --template-file "$SAMPLE_DIR/template.json"

      - name: Deploy temporary stack
        id: deploy_stack
        run: |
          set -euo pipefail
          account_id=$(aws sts get-caller-identity --query Account --output text)
          stack_hash=$(printf '%s' "$STACK_NAME" | sha256sum | cut -c1-12)
          bucket_suffix="${account_id}-${AWS_REGION}-${stack_hash}"
          raw_bucket_name="hydra-public-raw-${bucket_suffix}"
          curated_bucket_name="hydra-public-curated-${bucket_suffix}"
          echo "RAW_BUCKET=$raw_bucket_name" >> "$GITHUB_ENV"
          echo "CURATED_BUCKET=$curated_bucket_name" >> "$GITHUB_ENV"
          sam deploy \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              RawBucketName="$raw_bucket_name" \
              CuratedBucketName="$curated_bucket_name" \
            --tags hydra:sample=aws-market-data-pipeline hydra:data-boundary=synthetic-non-live hydra:deployment-run="$DEPLOYMENT_RUN_TOKEN"

      - name: Read non-sensitive stack outputs
        run: |
          set -euo pipefail
          output() {
            aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" \
              --output text
          }
          echo "RAW_BUCKET=$(output RawBucketName)" >> "$GITHUB_ENV"
          echo "CURATED_BUCKET=$(output CuratedBucketName)" >> "$GITHUB_ENV"
          echo "GLUE_DATABASE=$(output GlueDatabaseName)" >> "$GITHUB_ENV"
          echo "ATHENA_WORKGROUP=$(output AthenaWorkGroupName)" >> "$GITHUB_ENV"

      - name: Build expected outputs and upload synthetic fixture
        run: |
          set -euo pipefail
          cd "$SAMPLE_DIR"
          python local_demo.py --output-dir build/local
          RUN_ID=$(python -c "import json; print(json.load(open('build/local/manifest.json'))['pipeline_run_id'])")
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          aws s3 cp \
            fixtures/synthetic_market_events.csv \
            "s3://$RAW_BUCKET/raw/synthetic_market_events.csv" \
            --sse AES256 \
            --region "$AWS_REGION"

      - name: Wait for deterministic cloud outputs
        run: |
          set -euo pipefail
          manifest="s3://$CURATED_BUCKET/curated/manifests/$RUN_ID/manifest.json"
          for attempt in $(seq 1 30); do
            if aws s3 ls "$manifest" --region "$AWS_REGION" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for $manifest" >&2
          exit 1

      - name: Download and compare deployed artifacts
        run: |
          set -euo pipefail
          mkdir -p "$SAMPLE_DIR/build/deployed"
          aws s3 cp "s3://$CURATED_BUCKET/curated/accepted/$RUN_ID/normalized_events.jsonl" "$SAMPLE_DIR/build/deployed/normalized_events.jsonl"
          aws s3 cp "s3://$CURATED_BUCKET/curated/quarantine/$RUN_ID/quarantine_records.jsonl" "$SAMPLE_DIR/build/deployed/quarantine_records.jsonl"
          aws s3 cp "s3://$CURATED_BUCKET/curated/manifests/$RUN_ID/manifest.json" "$SAMPLE_DIR/build/deployed/manifest.json"
          cmp "$SAMPLE_DIR/build/local/normalized_events.jsonl" "$SAMPLE_DIR/build/deployed/normalized_events.jsonl"
          cmp "$SAMPLE_DIR/build/local/quarantine_records.jsonl" "$SAMPLE_DIR/build/deployed/quarantine_records.jsonl"
          cmp "$SAMPLE_DIR/build/local/manifest.json" "$SAMPLE_DIR/build/deployed/manifest.json"

      - name: Run bounded Athena verification query
        run: |
          set -euo pipefail
          query='SELECT symbol, COUNT(*) AS row_count FROM normalized_events GROUP BY symbol ORDER BY symbol'
          QUERY_ID=$(aws athena start-query-execution \
            --query-string "$query" \
            --query-execution-context "Database=$GLUE_DATABASE" \
            --work-group "$ATHENA_WORKGROUP" \
            --region "$AWS_REGION" \
            --query QueryExecutionId \
            --output text)
          echo "QUERY_ID=$QUERY_ID" >> "$GITHUB_ENV"
          for attempt in $(seq 1 30); do
            state=$(aws athena get-query-execution --query-execution-id "$QUERY_ID" --query 'QueryExecution.Status.State' --output text)
            if [[ "$state" == "SUCCEEDED" ]]; then
              aws athena get-query-results --query-execution-id "$QUERY_ID" > "$SAMPLE_DIR/build/deployed/athena_query_results.json"
              exit 0
            fi
            if [[ "$state" == "FAILED" || "$state" == "CANCELLED" ]]; then
              aws athena get-query-execution --query-execution-id "$QUERY_ID"
              exit 1
            fi
            sleep 5
          done
          echo "Timed out waiting for Athena query $QUERY_ID" >&2
          exit 1

      - name: Write sanitized deployment evidence
        env:
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["SAMPLE_DIR"]) / "build" / "deployed"
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          evidence = {
              "accepted_rows": manifest["accepted_rows"],
              "athena_query_state": "SUCCEEDED",
              "aws_region": os.environ["AWS_REGION"],
              "deployed_outputs_match_local_replay": True,
              "github_run_id": os.environ["GITHUB_RUN_ID_VALUE"],
              "pipeline_run_id": os.environ["RUN_ID"],
              "quarantined_rows": manifest["quarantined_rows"],
              "schema_version": "hydra-aws-deployment-evidence/v1",
              "stack_name": os.environ["STACK_NAME"],
          }
          (root / "deployment_evidence.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Publish sanitized deployment evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hydra-aws-market-data-deployment-evidence
          path: aws-market-data-pipeline/build/deployed/deployment_evidence.json
          if-no-files-found: error

      - name: Empty versioned buckets and delete stack
        timeout-minutes: 75
        if: ${{ always() && inputs.teardown && steps.deploy_stack.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          set +e
          stack_description=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" --output json 2>&1)
          describe_status=$?
          set -e
          if [[ "$describe_status" -ne 0 ]]; then
            if [[ "$stack_description" == *"does not exist"* ]]; then
              exit 0
            fi
            printf '%s\n' "$stack_description" >&2
            exit "$describe_status"
          fi

          stack_owner=$(jq -r '.Stacks[0].Tags[]? | select(.Key == "hydra:deployment-run") | .Value' <<< "$stack_description")
          if [[ "$stack_owner" != "$DEPLOYMENT_RUN_TOKEN" ]]; then
            echo "Refusing teardown because the stack ownership tag does not match this run." >&2
            exit 1
          fi

          stack_status=$(jq -r '.Stacks[0].StackStatus' <<< "$stack_description")
          for attempt in $(seq 1 360); do
            case "$stack_status" in
              CREATE_IN_PROGRESS|ROLLBACK_IN_PROGRESS)
                sleep 10
                stack_status=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" --query 'Stacks[0].StackStatus' --output text)
                ;;
              *)
                break
                ;;
            esac
          done
          case "$stack_status" in
            CREATE_COMPLETE|CREATE_FAILED|ROLLBACK_COMPLETE|ROLLBACK_FAILED) ;;
            *)
              echo "Refusing teardown in unexpected CloudFormation state: $stack_status" >&2
              exit 1
              ;;
          esac

          resources=$(aws cloudformation describe-stack-resources --stack-name "$STACK_NAME" --region "$AWS_REGION" --output json)
          while IFS=$'\t' read -r logical_id bucket_name; do
            case "$logical_id" in
              RawBucket) expected_bucket="$RAW_BUCKET" ;;
              CuratedBucket) expected_bucket="$CURATED_BUCKET" ;;
              *) continue ;;
            esac
            if [[ "$bucket_name" != "$expected_bucket" ]]; then
              echo "Refusing to empty an S3 bucket not bound to this stack resource." >&2
              exit 1
            fi

            aws s3 rm "s3://$bucket_name" --recursive --region "$AWS_REGION"
            token=""
            while :; do
              if [[ -n "$token" ]]; then
                versions=$(aws s3api list-object-versions --bucket "$bucket_name" --region "$AWS_REGION" --page-size 1000 --max-items 1000 --starting-token "$token" --output json)
              else
                versions=$(aws s3api list-object-versions --bucket "$bucket_name" --region "$AWS_REGION" --page-size 1000 --max-items 1000 --output json)
              fi
              deletions=$(jq '{Objects: (((.Versions // []) + (.DeleteMarkers // [])) | map({Key,VersionId})), Quiet: true}' <<< "$versions")
              deletion_count=$(jq '.Objects | length' <<< "$deletions")
              for ((offset = 0; offset < deletion_count; offset += 1000)); do
                delete_batch=$(jq --argjson offset "$offset" '{Objects: .Objects[$offset:($offset + 1000)], Quiet: true}' <<< "$deletions")
                delete_result=$(aws s3api delete-objects --bucket "$bucket_name" --region "$AWS_REGION" --delete "$delete_batch" --output json)
                if [[ $(jq '.Errors | length' <<< "$delete_result") -gt 0 ]]; then
                  echo "S3 version cleanup reported errors for $bucket_name." >&2
                  exit 1
                fi
              done
              token=$(jq -r '.NextToken // empty' <<< "$versions")
              [[ -z "$token" ]] && break
            done
          done < <(jq -r '.StackResources[] | select((.LogicalResourceId == "RawBucket" or .LogicalResourceId == "CuratedBucket") and (.ResourceStatus == "CREATE_COMPLETE" or .ResourceStatus == "DELETE_FAILED")) | [.LogicalResourceId, .PhysicalResourceId] | @tsv' <<< "$resources")

          sam delete --stack-name "$STACK_NAME" --region "$AWS_REGION" --no-prompts
