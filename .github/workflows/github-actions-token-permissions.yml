name: GitHub Actions token permissions

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "tools/test_github_actions_token_permissions.py"
      - "tools/validate_github_actions_token_permissions.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "tools/test_github_actions_token_permissions.py"
      - "tools/validate_github_actions_token_permissions.py"

permissions:
  contents: read

jobs:
  validate-token-permissions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Test token permission policy
        run: python -m unittest tools/test_github_actions_token_permissions.py -v

      - name: Validate workflow token permissions
        run: python tools/validate_github_actions_token_permissions.py
