name: NYX C main runtime gates

on:
  push:
    branches:
      - nyx/c-main-d7af-runtime-gates-20261003

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Preserve exact bytes and long paths
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          ref: d7af2cb8e56465aab8147f749ed1c65c6f861a1d
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bind exact main
        shell: pwsh
        run: |
          $head=(git rev-parse HEAD).Trim()
          if($head -ne 'd7af2cb8e56465aab8147f749ed1c65c6f861a1d') { throw "main drift: $head" }
          "EXACT_MAIN=$head"
      - name: Run runtime unresolved gates
        shell: pwsh
        run: |
          $env:PYTHONPATH="$env:GITHUB_WORKSPACE\constraint-runtime\src"
          python -B -m unittest discover -s constraint-runtime/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'C_RUNTIME_GATES=PASS'
