name: Thread G receipt input validation Windows

on:
  push:
    branches: [nyx/thread-g-receipt-validation-repair-20261001]

permissions:
  contents: read

jobs:
  receipt-inputs:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - name: Preserve Git blob bytes on Windows
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Use portable D drive workspace
        run: |
          if (-not $env:GITHUB_WORKSPACE.StartsWith('D:\', [StringComparison]::OrdinalIgnoreCase)) { throw 'D drive checkout required' }
          New-Item -ItemType Directory -Force D:\NYX_PORTABLE\THREAD_G_RECEIPT_REPAIR | Out-Null
          'TEMP=D:\NYX_PORTABLE\THREAD_G_RECEIPT_REPAIR' | Out-File -Append $env:GITHUB_ENV
          'TMP=D:\NYX_PORTABLE\THREAD_G_RECEIPT_REPAIR' | Out-File -Append $env:GITHUB_ENV
          git worktree add --detach D:\NYX_PORTABLE\THREAD_G_REPO $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Reproduce pinned baseline and check candidate
        working-directory: D:\NYX_PORTABLE\THREAD_G_REPO
        run: python -B validation/thread_g/run_windows.py
      - name: Preserve exact results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: thread-g-receipt-windows-${{ github.sha }}
          path: D:\NYX_PORTABLE\THREAD_G_RECEIPT_REPAIR/*.*
          if-no-files-found: error
