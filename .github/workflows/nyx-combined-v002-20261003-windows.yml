name: NYX combined V002 candidate Windows C and D

on:
  push:
    branches: [nyx/combined-119-138-143-validation-20261003]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: "1"
      TEMP: D:\NYX_PORTABLE\COMBINED_V002_20261003\temp
      TMP: D:\NYX_PORTABLE\COMBINED_V002_20261003\temp
      PIP_CACHE_DIR: D:\NYX_PORTABLE\COMBINED_V002_20261003\pip-cache
    steps:
      - name: Prepare isolated D drive validation directories
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'D:\NYX_PORTABLE\COMBINED_V002_20261003\temp', 'D:\NYX_PORTABLE\COMBINED_V002_20261003\report' | Out-Null
          git config --global core.longpaths true
          git clone --no-checkout https://github.com/HYDRADATAAI/Hydra.git D:\NYX_PORTABLE\COMBINED_V002_20261003\harness
          if ($LASTEXITCODE -ne 0) { throw 'Harness clone failed' }
          git -C D:\NYX_PORTABLE\COMBINED_V002_20261003\harness -c core.autocrlf=false checkout --detach $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Harness checkout failed' }
          git clone --no-checkout https://github.com/HYDRADATAAI/Hydra.git D:\NYX_PORTABLE\COMBINED_V002_20261003\source
          if ($LASTEXITCODE -ne 0) { throw 'Candidate clone failed' }
          git -C D:\NYX_PORTABLE\COMBINED_V002_20261003\source fetch origin 82d87e93bb06780a13ad2abb0a19c6dc728087ed
          if ($LASTEXITCODE -ne 0) { throw 'Pinned preview unavailable' }
          git -C D:\NYX_PORTABLE\COMBINED_V002_20261003\source -c core.autocrlf=false checkout --detach 82d87e93bb06780a13ad2abb0a19c6dc728087ed
          if ($LASTEXITCODE -ne 0) { throw 'Exact candidate checkout failed' }
          git -C D:\NYX_PORTABLE\COMBINED_V002_20261003\source config core.autocrlf false
          git -C D:\NYX_PORTABLE\COMBINED_V002_20261003\source config core.longpaths true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install and record isolated test dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --target D:\NYX_PORTABLE\COMBINED_V002_20261003\deps pytest==8.3.5 pytest-subtests==0.14.2 2>&1 | Tee-Object D:\NYX_PORTABLE\COMBINED_V002_20261003\report\dependency-install.log
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          python -m pip list --path D:\NYX_PORTABLE\COMBINED_V002_20261003\deps --format=json > D:\NYX_PORTABLE\COMBINED_V002_20261003\report\dependencies.json
      - name: Verify the collected-to-executed report guard
        shell: pwsh
        run: |
          python -B D:\NYX_PORTABLE\COMBINED_V002_20261003\harness\validation\combined-v002-20261003\test_report_gate.py 2>&1 | Tee-Object D:\NYX_PORTABLE\COMBINED_V002_20261003\report\report-gate-selftests.log
          if ($LASTEXITCODE -ne 0) { throw 'Validation report guard selftests failed' }
      - name: Run all fifteen groups against the exact current-main candidate
        shell: pwsh
        env:
          PYTHONPATH: D:\NYX_PORTABLE\COMBINED_V002_20261003\deps
        run: |
          python D:\NYX_PORTABLE\COMBINED_V002_20261003\harness\validation\combined-v002-20261003\run_matrix.py D:\NYX_PORTABLE\COMBINED_V002_20261003\source D:\NYX_PORTABLE\COMBINED_V002_20261003\report\matrix
          exit $LASTEXITCODE
      - name: Windows path and symlink validation after passing the full matrix
        shell: pwsh
        env:
          PYTHONPATH: D:\NYX_PORTABLE\COMBINED_V002_20261003\deps
        run: |
          python -B D:\NYX_PORTABLE\COMBINED_V002_20261003\harness\validation\combined-v002-20261003\run_v006.py D:\NYX_PORTABLE\COMBINED_V002_20261003\source D:\NYX_PORTABLE\COMBINED_V002_20261003\report\matrix D:\NYX_PORTABLE\COMBINED_V002_20261003\report\v006
          exit $LASTEXITCODE
      - name: Export complete public validation evidence through the job log
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $report = 'D:\NYX_PORTABLE\COMBINED_V002_20261003\report'
          $bundle = 'D:\NYX_PORTABLE\COMBINED_V002_20261003\validation-evidence.zip'
          $harness = 'D:\NYX_PORTABLE\COMBINED_V002_20261003\harness\validation\combined-v002-20261003'
          if (Test-Path -LiteralPath $harness) {
            Copy-Item -LiteralPath $harness -Destination "$report\harness_provenance" -Recurse -Force
          }
          Compress-Archive -Path "$report\*" -DestinationPath $bundle -CompressionLevel Optimal -Force
          $digest = (Get-FileHash -LiteralPath $bundle -Algorithm SHA256).Hash.ToLowerInvariant()
          $encoded = [Convert]::ToBase64String([IO.File]::ReadAllBytes($bundle))
          "NYX_EVIDENCE_ZIP_SHA256=$digest"
          "NYX_EVIDENCE_ZIP_BYTES=$((Get-Item -LiteralPath $bundle).Length)"
          'NYX_EVIDENCE_ZIP_BEGIN'
          for ($index = 0; $index -lt $encoded.Length; $index += 4096) {
            $encoded.Substring($index, [Math]::Min(4096, $encoded.Length - $index))
          }
          'NYX_EVIDENCE_ZIP_END'
      - name: Preserve complete validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NYX-combined-V002-Windows-20261003-evidence
          path: D:\NYX_PORTABLE\COMBINED_V002_20261003\report
          if-no-files-found: error
          retention-days: 30
