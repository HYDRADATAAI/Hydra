name: Constraint Read-Only Live Canaries

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */12 * * *"

permissions:
  contents: read

jobs:
  canaries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install Constraint runtime
        run: python -m pip install -e constraint-runtime
      - name: Run read-only source canaries
        run: |
          mkdir -p canary-output
          python -m hydra_constraint.canary             --config constraint-runtime/config/live_canaries.json             --output canary-output/report.json
      - name: Upload canary report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: constraint-live-canary-report
          path: canary-output/report.json
          retention-days: 14
