name: Constraint Read-Only Live Canaries

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */12 * * *"

permissions:
  contents: read

jobs:
  canaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Install Constraint runtime
        run: python -m pip install -e constraint-runtime
      - name: Run read-only source canaries
        run: |
          mkdir -p canary-output
          python -m hydra_constraint.canary             --config constraint-runtime/config/live_canaries.json             --output canary-output/report.json
      - name: Upload canary report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: constraint-live-canary-report
          path: canary-output/report.json
          retention-days: 14
