name: Validation only - replay denominator sensitivity

on:
  pull_request:
    paths:
      - 'constraint-replay/tests/test_replay_scoring_typed_inputs.py'
      - 'tools/test_replay_denominator_sensitivity.py'
      - '.github/workflows/validation-replay-denominator-sensitivity.yml'

permissions:
  contents: read

jobs:
  denominator-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Set up governed Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Record exact clean candidate and source parent
        env:
          EXPECTED_VALIDATION_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_VALIDATION_HEAD"
          test "$(git rev-parse HEAD^)" = 'e3b4dd000034a769794e378beff4b483ace8bfe1'
          test "$(git rev-parse 'HEAD^^{tree}')" = '5d931f6eb42efda127c0f988d0caa272ca9fb3a8'
          test -z "$(git status --porcelain --untracked-files=all)"
          git rev-parse HEAD > "$RUNNER_TEMP/denominator-source-head"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/denominator-source-tree"
          printf 'VALIDATION_HEAD='
          cat "$RUNNER_TEMP/denominator-source-head"
          printf 'VALIDATION_TREE='
          cat "$RUNNER_TEMP/denominator-source-tree"
          sha256sum tools/test_replay_denominator_sensitivity.py .github/workflows/validation-replay-denominator-sensitivity.yml
          git ls-tree HEAD constraint-replay/tests/test_replay_scoring_typed_inputs.py constraint-replay/src/hydra_constraint_replay/metrics.py
      - name: Install existing pytest dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir pytest
      - name: Prove exact denominator mutation sensitivity
        run: |
          python -I -B tools/test_replay_denominator_sensitivity.py \
            --repository "$GITHUB_WORKSPACE" \
            --report "$RUNNER_TEMP/replay-denominator-sensitivity.json"
      - name: Always verify exact source preservation
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(cat "$RUNNER_TEMP/denominator-source-head")"
          test "$(git rev-parse 'HEAD^{tree}')" = "$(cat "$RUNNER_TEMP/denominator-source-tree")"
          test -z "$(git status --porcelain --untracked-files=all)"
          git diff --exit-code
          git diff --cached --exit-code
          echo DENOMINATOR_WORKFLOW_SOURCE_PRESERVATION=PASS
