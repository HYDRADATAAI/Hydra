name: Constraint T1 raw artifact store

on:
  pull_request:
    paths:
      - "constraint-t1-raw-artifact-store/**"
      - ".github/workflows/constraint-t1-raw-artifact-store.yml"
  push:
    branches:
      - main
    paths:
      - "constraint-t1-raw-artifact-store/**"
      - ".github/workflows/constraint-t1-raw-artifact-store.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Reject private T1 records in the public tree
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          while IFS= read -r file; do
            case "$file" in
              constraint-t1-raw-artifact-store/raw/*|\
              constraint-t1-raw-artifact-store/data/*|\
              constraint-t1-raw-artifact-store/objects/*|\
              constraint-t1-raw-artifact-store/receipts/*|\
              constraint-t1-raw-artifact-store/releases/*|\
              constraint-t1-raw-artifact-store/*.raw|\
              constraint-t1-raw-artifact-store/*/*.raw|\
              constraint-t1-raw-artifact-store/*/*/*.raw|\
              constraint-t1-raw-artifact-store/*/*/*/*.raw)
                echo "::error file=$file::Private T1 raw-store records must stay outside public Git."
                failures=$((failures + 1))
                ;;
            esac
          done < <(git ls-files)
          if [[ "$failures" -gt 0 ]]; then
            echo "T1_PUBLIC_RAW_BOUNDARY=FAIL"
            exit 1
          fi
          echo "T1_PUBLIC_RAW_BOUNDARY=PASS"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Test immutable private raw store
        working-directory: constraint-t1-raw-artifact-store
        run: |
          export PYTHONPATH="$PWD/src"
          python -m unittest discover -s tests -t . -v
