name: Public repository hygiene

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  public-root-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test tracked artifact path policy
        run: python -m unittest discover -s tools -p "test_public_root_hygiene.py" -v

      - name: Reject tracked build-transfer artifacts
        run: python tools/public_root_hygiene.py
