name: NYX C main first-slice hostile

on:
  push:
    branches:
      - nyx/c-main-d7af-first-slice-hostile-20261003

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Preserve exact bytes and long paths
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          ref: d7af2cb8e56465aab8147f749ed1c65c6f861a1d
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bind exact main
        shell: pwsh
        run: |
          $head=(git rev-parse HEAD).Trim()
          if($head -ne 'd7af2cb8e56465aab8147f749ed1c65c6f861a1d') { throw "main drift: $head" }
          "EXACT_MAIN=$head"
      - name: Run first-slice and successor hostile gates
        shell: pwsh
        run: |
          python -B tools/validate_constraint_first_slice_successor.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tools/test_constraint_first_slice_adversarial.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tools/validate_constraint_first_slice_acceptance_gate.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tools/test_constraint_first_slice_acceptance_gate_adversarial.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tools/validate_constraint_ai_infra_pass005.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tools/nyx_validate_constraint_successor_chain.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tools/nyx_test_constraint_successor_chain_adversarial.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'C_FIRST_SLICE_HOSTILE=PASS'
