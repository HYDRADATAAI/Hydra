name: Constraint operating report

on:
  pull_request:
    paths:
      - "constraint-replay/**"
      - "constraint-geopolitical-policy/**"
      - "constraint-physical-dependency/**"
      - ".github/workflows/constraint-operating-report.yml"
  workflow_dispatch:

jobs:
  operating-report-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install stacked Constraint packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e ./constraint-physical-dependency -e ./constraint-replay -e ./constraint-geopolitical-policy
      - name: Check Batch 018 operating snapshot
        run: >-
          python constraint-replay/scripts/report_HYDRA_CONSTRAINT_BATCH018_operating_20260926.py
          snapshot
          --check constraint-replay/operating/HYDRA_CONSTRAINT_BATCH018_OPERATING_SNAPSHOT_20260926.json
      - name: Test Batch 018 operating manifest
        run: python -m pytest -q constraint-replay/tests/test_operating_manifest_batch18.py
      - name: Test Batch 018 stacked operating integration
        run: >-
          python -m unittest discover
          -s constraint-geopolitical-policy/tests
          -p "test_HYDRA_CONSTRAINT_BATCH018_operating_report_integration_20260926.py"
          -v
