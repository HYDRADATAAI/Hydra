name: Nyx R37 Athena negative fixture coverage

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - tools/test_athena_negative_fixture_coverage.py
      - tools/test_aws_deploy_validator_contract.py
      - tools/validate_public_repository.py
      - .github/workflows/aws-market-data-deploy.yml
      - .github/workflows/validation-athena-negative-fixture-coverage.yml

permissions:
  contents: read

jobs:
  mutation-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install pinned YAML parser before fixture execution
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Record exact checkout inventory
        run: |
          python -B - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          def git(*args):
              return subprocess.check_output(["git", *args], env={**os.environ, "GIT_OPTIONAL_LOCKS": "0"}, timeout=30)

          if git("status", "--porcelain=v1", "--untracked-files=all"):
              raise SystemExit("Checkout is not clean")
          head = git("rev-parse", "HEAD").decode().strip()
          if head != os.environ["EXPECTED_HEAD"]:
              raise SystemExit("Exact PR head checkout mismatch")
          files = {}
          for raw in git("ls-files", "-z").split(b"\0"):
              if raw:
                  path = Path(raw.decode())
                  if path.is_symlink() or not path.is_file():
                      raise SystemExit("Nonregular tracked source")
                  files[str(path)] = hashlib.sha256(path.read_bytes()).hexdigest()
          if len(files) != 776:
              raise SystemExit("Tracked inventory must be 774 source files plus two proof files")
          record = {"head": head, "tree": git("rev-parse", "HEAD^{tree}").decode().strip(), "files": files}
          (Path(os.environ["RUNNER_TEMP"]) / "r37-athena-source-snapshot.json").write_text(json.dumps(record, sort_keys=True), encoding="utf-8")
          print(json.dumps({"source_head": record["head"], "source_tree": record["tree"], "tracked_files": len(files)}))
          PY
      - name: Prove actual Athena negative fixtures kill command-check mutant
        run: python -B tools/test_athena_negative_fixture_coverage.py
      - name: Verify exact checkout preservation
        if: always()
        run: |
          python -B - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          def git(*args):
              return subprocess.check_output(["git", *args], env={**os.environ, "GIT_OPTIONAL_LOCKS": "0"}, timeout=30)

          path = Path(os.environ["RUNNER_TEMP"]) / "r37-athena-source-snapshot.json"
          before = json.loads(path.read_text(encoding="utf-8"))
          files = {}
          for raw in git("ls-files", "-z").split(b"\0"):
              if raw:
                  member = Path(raw.decode())
                  if member.is_symlink() or not member.is_file():
                      raise SystemExit("Nonregular tracked source after proof")
                  files[str(member)] = hashlib.sha256(member.read_bytes()).hexdigest()
          after = {"head": git("rev-parse", "HEAD").decode().strip(), "tree": git("rev-parse", "HEAD^{tree}").decode().strip(), "files": files}
          if before != after or git("status", "--porcelain=v1", "--untracked-files=all"):
              raise SystemExit("Source changed during coverage proof")
          print(json.dumps({"source_head": after["head"], "source_tree": after["tree"], "source_unchanged": True, "tracked_files": len(files)}))
          PY
