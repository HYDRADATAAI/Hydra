name: constraint-replay

on:
  push:
    paths:
      - "constraint-replay/**"
      - ".github/workflows/constraint-replay.yml"
  pull_request:
    paths:
      - "constraint-replay/**"
      - ".github/workflows/constraint-replay.yml"

jobs:
  replay-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: constraint-replay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m pip install pytest
      - run: python -m pytest -q
      - name: Run Batch 015 classified replay E2E contract
        run: >-
          python scripts/run_HYDRA_CONSTRAINT_BATCH015_classified_replay_e2e_20260926.py
          --check constraint-replay/runs/HYDRA_CONSTRAINT_BATCH015_CLASSIFIED_REPLAY_E2E_RUN_20260926.json
