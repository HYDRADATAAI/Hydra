name: constraint-replay

on:
  push:
    paths:
      - "constraint-replay/**"
      - ".github/workflows/constraint-replay.yml"
  pull_request:
    paths:
      - "constraint-replay/**"
      - ".github/workflows/constraint-replay.yml"

jobs:
  replay-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: constraint-replay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m pip install pytest
      - run: python -m pytest -q
