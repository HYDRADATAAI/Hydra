name: Market data pipeline sample

on:
  pull_request:
    paths:
      - "market-data-pipeline-sample/**"
      - ".github/workflows/market-data-pipeline.yml"
  push:
    branches:
      - main
    paths:
      - "market-data-pipeline-sample/**"
      - ".github/workflows/market-data-pipeline.yml"

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run tests
        working-directory: market-data-pipeline-sample
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -t . -v

      - name: Build deterministic synthetic outputs
        working-directory: market-data-pipeline-sample
        env:
          PYTHONPATH: src
        run: |
          python -m hydra_market_pipeline \
            --input data/raw/synthetic_market_events.csv \
            --aliases config/symbol_aliases.json \
            --output-dir build/demo

      - name: Verify expected manifest counts
        working-directory: market-data-pipeline-sample
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          def require(condition, detail):
              if not condition:
                  raise SystemExit(f"SAMPLE_MANIFEST=FAIL: {detail}")

          manifest = json.loads(Path("build/demo/manifest.json").read_text(encoding="utf-8"))
          inputs = manifest.get("inputs")
          require(manifest.get("accepted_rows") == 3, "accepted row count changed")
          require(manifest.get("quarantined_rows") == 4, "quarantined row count changed")
          require(manifest.get("source_rows") == 7, "source row count changed")
          require(manifest.get("schema_version") == "hydra-market-pipeline-manifest/v2", "schema changed")
          require(isinstance(inputs, dict) and set(inputs) == {"resolved_aliases_json", "source_csv"}, "input snapshot set changed")
          expected = {
              "resolved_aliases_json": ("resolved_symbol_aliases.json", "hydra-market-resolved-aliases/v1"),
              "source_csv": ("source_snapshot.csv", "hydra-market-source-csv/v1"),
          }
          for key, (filename, schema_version) in expected.items():
              descriptor = inputs.get(key, {})
              require(descriptor.get("file") == filename, f"{key} filename changed")
              require(descriptor.get("schema_version") == schema_version, f"{key} schema changed")
              actual = hashlib.sha256(Path("build/demo", filename).read_bytes()).hexdigest()
              require(descriptor.get("sha256") == actual, f"{key} digest mismatch")
          require(manifest.get("source_file_sha256") == inputs["source_csv"]["sha256"], "source digest binding changed")
          require(manifest.get("aliases_sha256") == inputs["resolved_aliases_json"]["sha256"], "alias digest binding changed")
          print("SAMPLE_MANIFEST=PASS")
          print("INPUT_SNAPSHOTS_VERIFIED=2")
          print("SOURCE_ROWS_SNAPSHOT_VERIFIED=7")
          PY

      - name: Prove checkpoint recovery and idempotent replay
        working-directory: market-data-pipeline-sample
        env:
          PYTHONPATH: src
        run: python run_recovery_demo.py --output-dir build/operations

      - name: Verify operational receipt
        working-directory: market-data-pipeline-sample
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(Path("build/operations/recovery_receipt.json").read_text(encoding="utf-8"))
          manifest = json.loads(Path("build/operations/operations_manifest.json").read_text(encoding="utf-8"))
          assert receipt["first_attempt"]["status"] == "INTERRUPTED_AS_INJECTED", receipt
          assert receipt["resume_attempt"]["status"] == "PASS", receipt
          assert receipt["completed_replay"]["processed_sources"] == [], receipt
          assert receipt["completed_replay"]["manifest_unchanged"], receipt
          assert receipt["completed_replay"]["metrics_unchanged"], receipt
          assert manifest["slis"]["partition_completion_ratio"]["status"] == "PASS", manifest
          assert manifest["slis"]["row_accounting_ratio"]["status"] == "PASS", manifest
          print("OPERATIONS_RECEIPT=PASS")
          PY

      - name: Publish synthetic pipeline outputs
        uses: actions/upload-artifact@v4
        with:
          name: hydra-market-data-pipeline-sample
          path: |
            market-data-pipeline-sample/build/demo/
            market-data-pipeline-sample/build/operations/
          if-no-files-found: error
