name: Constraint Runtime V018

on:
  pull_request:
    paths:
      - "constraint-runtime/**"
      - ".github/workflows/constraint-runtime-v018.yml"
  push:
    branches: [main]
    paths:
      - "constraint-runtime/**"
      - ".github/workflows/constraint-runtime-v018.yml"

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime package
        run: python -m pip install -e constraint-runtime
      - name: Compile source
        run: python -m compileall -q constraint-runtime/src
      - name: Run evidence/runtime hostile smoke suite
        run: python -m unittest discover -s constraint-runtime/tests -v
      - name: Enforce no committed runtime state
        run: |
          test ! -d constraint-runtime/state
          test ! -d constraint-runtime/raw_archive
          test ! -d constraint-runtime/golden
