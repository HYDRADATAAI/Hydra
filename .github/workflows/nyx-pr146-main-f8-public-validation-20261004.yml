name: NYX PR146 main f8 exact-source public validation

on:
  pull_request:
    paths:
      - '.github/workflows/nyx-pr146-main-f8-public-validation-20261004.yml'

permissions:
  contents: read

jobs:
  public-validator:
    name: '${{ matrix.target }} / exact-source public validator'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: 'PR250'
            sha: '9e38cbd0072474cf8700bd23f082c57ba3b8b56f'
            tree: 'f1b815e0fb931537ad8c705134229294650cc578'
          - target: 'PR251'
            sha: '91418e1feba63084b5d11464ae466f1b03f86498'
            tree: 'c80a5b2164da742cf84ca01d987ca26d141afe4a'
    steps:
      - name: Checkout exact source candidate
        uses: actions/checkout@v4
        with:
          ref: '${{ matrix.sha }}'
          persist-credentials: false
      - name: Set up governed Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bind exact source identity
        env:
          EXPECTED_SOURCE_SHA: '${{ matrix.sha }}'
          EXPECTED_SOURCE_TREE: '${{ matrix.tree }}'
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_SOURCE_TREE"
          printf 'SOURCE_COMMIT=%s\n' "$(git rev-parse HEAD)"
          printf 'SOURCE_TREE=%s\n' "$(git rev-parse HEAD^{tree})"
          printf 'GOVERNED_SCRIPT_BLOB=%s\n' "$(git hash-object tools/validate_public_repository.py)"
          test "$(git hash-object tools/validate_public_repository.py)" = "1b96dae6410998f175e25e8302a8720e34ac0b0f"
          python --version
      - name: Execute current public repository validator
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python tools/validate_public_repository.py
      - name: Verify exact identity and source preservation
        if: always()
        env:
          EXPECTED_SOURCE_SHA: '${{ matrix.sha }}'
          EXPECTED_SOURCE_TREE: '${{ matrix.tree }}'
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_SOURCE_TREE"
          git diff --exit-code
          test -z "$(git status --porcelain)"
          printf 'SOURCE_COMMIT_AFTER=%s\n' "$(git rev-parse HEAD)"
          printf 'SOURCE_TREE_AFTER=%s\n' "$(git rev-parse HEAD^{tree})"
          echo SOURCE_PRESERVATION=PASS
