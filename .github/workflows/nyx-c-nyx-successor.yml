name: NYX C NYX successor

on:
  push:
    branches:
      - nyx/c-d7af-nyx-successor-20261003

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Preserve exact bytes and long paths
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          ref: d7af2cb8e56465aab8147f749ed1c65c6f861a1d
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bind exact main
        shell: pwsh
        run: |
          $head=(git rev-parse HEAD).Trim()
          if($head -ne 'd7af2cb8e56465aab8147f749ed1c65c6f861a1d') { throw "main drift: $head" }
          "EXACT_MAIN=$head"
      - name: Execute bounded lane
        shell: pwsh
        run: |
          python -B tools/nyx_validate_constraint_successor_chain.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tools/nyx_test_constraint_successor_chain_adversarial.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'C_NYX_SUCCESSOR=PASS'
