name: NYX PR58 residual current-main Windows

on:
  push:
    branches:
      - nyx/validation-pr58-residual-current-main-20261004

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Preserve exact bytes and long paths
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          ref: 581ba1b0c17ad7e8d28c837755900fc627943bdf
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bind exact candidate
        shell: pwsh
        run: |
          $head=(git rev-parse HEAD).Trim()
          $tree=(git rev-parse 'HEAD^{tree}').Trim()
          if($head -ne '581ba1b0c17ad7e8d28c837755900fc627943bdf') { throw "candidate drift: $head" }
          if($tree -ne '4e4e354f21a8b3c2046cae5ddf8083908fb32f39') { throw "tree drift: $tree" }
          "PR58_RESIDUAL_HEAD=$head"
          "PR58_RESIDUAL_TREE=$tree"
      - name: Run residual materializer tests
        shell: pwsh
        run: |
          python -B tools/test_constraint_first_slice_private_materialization.py -v
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          'PR58_RESIDUAL_TESTS=PASS'
      - name: Run integrated owners
        shell: pwsh
        run: |
          python -m pip install pytest
          $env:PYTHONPATH="$env:GITHUB_WORKSPACE\constraint-physical-dependency\src;$env:GITHUB_WORKSPACE\constraint-geopolitical-policy\src;$env:GITHUB_WORKSPACE\constraint-replay\src;$env:GITHUB_WORKSPACE\constraint-t1-raw-artifact-store\src;$env:GITHUB_WORKSPACE\t6-fail-closed-validator\src"
          python -m pytest --import-mode=importlib constraint-physical-dependency/tests constraint-geopolitical-policy/tests constraint-replay/tests constraint-t1-raw-artifact-store/tests t6-fail-closed-validator/tests -q
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
      - name: Verify fail-closed owner gates
        shell: pwsh
        run: |
          python tools/validate_constraint_first_slice_successor.py
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          python tools/validate_constraint_lily_owner_seams.py
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          python tools/validate_constraint_first_slice_acceptance_gate.py
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          python tools/validate_constraint_first_slice_confidence_evaluation.py
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          python tools/validate_constraint_first_slice_outcome_coverage.py
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          python tools/validate_constraint_first_slice_custody.py
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          python tools/nyx_validate_constraint_successor_chain.py
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
      - name: Public-root hygiene
        shell: pwsh
        run: |
          $bad=@()
          foreach($file in @(git ls-files)){
            if($file -match '/') { continue }
            if($file -match '\.zip$|\.zip\.sha256$|^EXTRACT_.*\.ps1$| \([0-9]+\)\.[^/]+$'){ $bad += $file }
          }
          if($bad.Count -gt 0){ throw "public-root hygiene fail: $($bad -join ', ')" }
          'PUBLIC_ROOT_HYGIENE=PASS'
          'PR58_RESIDUAL_CURRENT_MAIN=PASS'
