name: PR119 repaired candidate Windows V006

on:
  push:
    branches: [nyx/pr119-repaired-windows-v006-20261001]

permissions:
  contents: read

jobs:
  repaired-candidate:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
      TEMP: D:\NYX_PORTABLE\V006\temp
      TMP: D:\NYX_PORTABLE\V006\temp
      PIP_CACHE_DIR: D:\NYX_PORTABLE\V006\pip-cache
    steps:
      - name: Prepare exact source and separate harness on D drive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'D:\NYX_PORTABLE\V006\temp', 'D:\NYX_PORTABLE\V006\report' | Out-Null
          git config --global core.longpaths true
          git clone --no-checkout https://github.com/HYDRADATAAI/Hydra.git D:\NYX_PORTABLE\V006\harness
          if ($LASTEXITCODE -ne 0) { throw 'Harness clone failed' }
          git -C D:\NYX_PORTABLE\V006\harness -c core.autocrlf=false checkout --detach $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Harness checkout failed' }
          git clone --no-checkout https://github.com/HYDRADATAAI/Hydra.git D:\NYX_PORTABLE\V006\source
          if ($LASTEXITCODE -ne 0) { throw 'Source clone failed' }
          git -C D:\NYX_PORTABLE\V006\source fetch origin b95d695dd290e581edb29c3b70379c3cb3180686
          if ($LASTEXITCODE -ne 0) { throw 'Pinned repaired candidate unavailable' }
          git -C D:\NYX_PORTABLE\V006\source -c core.autocrlf=false checkout --detach b95d695dd290e581edb29c3b70379c3cb3180686
          if ($LASTEXITCODE -ne 0) { throw 'Candidate checkout failed' }
          git -C D:\NYX_PORTABLE\V006\source config core.autocrlf false
          git -C D:\NYX_PORTABLE\V006\source config core.longpaths true
          Copy-Item -Recurse D:\NYX_PORTABLE\V006\harness\validation\pr119-repaired-v006 D:\NYX_PORTABLE\V006\report\harness
          Copy-Item D:\NYX_PORTABLE\V006\harness\.github\workflows\pr119-repaired-v006.yml D:\NYX_PORTABLE\V006\report\harness\workflow.yml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check --target D:\NYX_PORTABLE\V006\deps pytest==8.3.5 pytest-subtests==0.14.2 2>&1 | Tee-Object D:\NYX_PORTABLE\V006\report\dependency-install.log
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          python -m pip list --path D:\NYX_PORTABLE\V006\deps --format=json > D:\NYX_PORTABLE\V006\report\dependencies.json
      - name: Reconstruct candidate and run all fifteen matrix groups
        shell: pwsh
        env:
          PYTHONPATH: D:\NYX_PORTABLE\V006\deps
        run: |
          python -B D:\NYX_PORTABLE\V006\harness\validation\pr119-repaired-v006\run_matrix.py D:\NYX_PORTABLE\V006\source D:\NYX_PORTABLE\V006\report\matrix
          exit $LASTEXITCODE
      - name: V006 only after passing exact-candidate matrix
        shell: pwsh
        env:
          PYTHONPATH: D:\NYX_PORTABLE\V006\deps
        run: |
          python -B D:\NYX_PORTABLE\V006\harness\validation\pr119-repaired-v006\run_v006.py D:\NYX_PORTABLE\V006\source D:\NYX_PORTABLE\V006\report\matrix D:\NYX_PORTABLE\V006\report\v006
          exit $LASTEXITCODE
      - name: Preserve complete evidence including failed runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PR119-repaired-Windows-V006-evidence
          path: D:\NYX_PORTABLE\V006\report
          if-no-files-found: error
          retention-days: 30
