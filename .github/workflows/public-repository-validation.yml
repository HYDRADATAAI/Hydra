name: Public repository validation

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - ".gitignore"
      - ".gitattributes"
      - "aws-market-data-pipeline/**"
      - "governed-intelligence-sample/**"
      - "market-data-pipeline-sample/**"
      - "sql-data-quality-sample/**"
      - "t6-fail-closed-validator/**"
      - "tools/validate_public_repository.py"
      - ".github/workflows/aws-market-data-deploy.yml"
      - ".github/workflows/aws-market-data-pipeline.yml"
      - ".github/workflows/governed-intelligence-sample.yml"
      - ".github/workflows/market-data-pipeline.yml"
      - ".github/workflows/sql-data-quality-sample.yml"
      - ".github/workflows/public-repository-validation.yml"
      - ".github/workflows/t6-validator.yml"

permissions:
  contents: read

jobs:
  public-repository-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Test workflow action reference parsing
        run: python -m unittest tools/test_workflow_action_refs.py -v

      - name: Validate public core-repository contract
        run: python tools/validate_public_repository.py
