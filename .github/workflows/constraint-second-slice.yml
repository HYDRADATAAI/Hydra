name: Constraint second-slice validation

on:
  pull_request:
    paths:
      - "docs/constraint/second_slice/**"
      - "docs/constraint/architecture/HYDRA_CONSTRAINT_THREAD6_SUCCESSOR_BATCH017_MASTER_STATUS_V001_20260926.json"
      - "docs/constraint/architecture/HYDRA_CONSTRAINT_THREAD6_SUCCESSOR_BATCH018_MASTER_STATUS_V001_20260926.json"
      - "docs/constraint/architecture/HYDRA_CONSTRAINT_THREAD6_SUCCESSOR_BATCH019_*.json"
      - "docs/constraint/architecture/HYDRA_CONSTRAINT_THREAD6_SUCCESSOR_BATCH020_*.json"
      - "docs/constraint/architecture/HYDRA_CONSTRAINT_THREAD6_SUCCESSOR_BATCH021_*.json"
      - "docs/constraint/architecture/HYDRA_CONSTRAINT_THREAD6_SUCCESSOR_BATCH022_*.json"
      - "docs/constraint/architecture/HYDRA_CONSTRAINT_THREAD6_SUCCESSOR_BATCH023_*.json"
      - "docs/constraint/architecture/HYDRA_CONSTRAINT_THREAD6_SUCCESSOR_BATCH024_*.json"
      - "docs/constraint/validation/HYDRA_CONSTRAINT_THREAD6_SUCCESSOR_BATCH019_*"
      - "docs/constraint/validation/HYDRA_CONSTRAINT_THREAD6_SUCCESSOR_BATCH020_*"
      - "docs/constraint/validation/HYDRA_CONSTRAINT_THREAD6_SUCCESSOR_BATCH021_*"
      - "docs/constraint/validation/HYDRA_CONSTRAINT_THREAD6_SUCCESSOR_BATCH022_*"
      - "docs/constraint/validation/HYDRA_CONSTRAINT_THREAD6_SUCCESSOR_BATCH023_*"
      - "docs/constraint/validation/HYDRA_CONSTRAINT_THREAD6_SUCCESSOR_BATCH024_*"
      - "tools/validate_constraint_second_slice_batch017_audit.py"
      - "tools/test_constraint_second_slice_batch017_audit_adversarial.py"
      - "tools/validate_constraint_second_slice_batch018_population.py"
      - "tools/test_constraint_second_slice_batch018_population_adversarial.py"
      - "tools/validate_constraint_second_slice_batch019_facility_material_equipment.py"
      - "tools/test_constraint_second_slice_batch019_facility_material_equipment_adversarial.py"
      - "tools/validate_constraint_second_slice_batch020_policy_outcomes_cases.py"
      - "tools/test_constraint_second_slice_batch020_policy_outcomes_cases_adversarial.py"
      - "tools/validate_constraint_second_slice_batch021_beneficiary_substitution_power.py"
      - "tools/test_constraint_second_slice_batch021_beneficiary_substitution_power_adversarial.py"
      - "tools/validate_constraint_second_slice_batch022_tool_material_duplicate.py"
      - "tools/test_constraint_second_slice_batch022_tool_material_duplicate_adversarial.py"
      - "tools/validate_constraint_second_slice_batch023_hbm_yield_migration.py"
      - "tools/test_constraint_second_slice_batch023_hbm_yield_migration_adversarial.py"
      - "tools/validate_constraint_second_slice_batch024_acceptance_gate.py"
      - "tools/test_constraint_second_slice_batch024_acceptance_gate_adversarial.py"
      - ".github/workflows/constraint-second-slice.yml"
  push:
    branches:
      - main
    paths:
      - "docs/constraint/second_slice/**"
      - "docs/constraint/architecture/HYDRA_CONSTRAINT_THREAD6_SUCCESSOR_BATCH017_MASTER_STATUS_V001_20260926.json"
      - "docs/constraint/architecture/HYDRA_CONSTRAINT_THREAD6_SUCCESSOR_BATCH018_MASTER_STATUS_V001_20260926.json"
      - "docs/constraint/architecture/HYDRA_CONSTRAINT_THREAD6_SUCCESSOR_BATCH019_*.json"
      - "docs/constraint/architecture/HYDRA_CONSTRAINT_THREAD6_SUCCESSOR_BATCH020_*.json"
      - "docs/constraint/architecture/HYDRA_CONSTRAINT_THREAD6_SUCCESSOR_BATCH021_*.json"
      - "docs/constraint/architecture/HYDRA_CONSTRAINT_THREAD6_SUCCESSOR_BATCH022_*.json"
      - "docs/constraint/architecture/HYDRA_CONSTRAINT_THREAD6_SUCCESSOR_BATCH023_*.json"
      - "docs/constraint/architecture/HYDRA_CONSTRAINT_THREAD6_SUCCESSOR_BATCH024_*.json"
      - "docs/constraint/validation/HYDRA_CONSTRAINT_THREAD6_SUCCESSOR_BATCH019_*"
      - "docs/constraint/validation/HYDRA_CONSTRAINT_THREAD6_SUCCESSOR_BATCH020_*"
      - "docs/constraint/validation/HYDRA_CONSTRAINT_THREAD6_SUCCESSOR_BATCH021_*"
      - "docs/constraint/validation/HYDRA_CONSTRAINT_THREAD6_SUCCESSOR_BATCH022_*"
      - "docs/constraint/validation/HYDRA_CONSTRAINT_THREAD6_SUCCESSOR_BATCH023_*"
      - "docs/constraint/validation/HYDRA_CONSTRAINT_THREAD6_SUCCESSOR_BATCH024_*"
      - "tools/validate_constraint_second_slice_batch017_audit.py"
      - "tools/test_constraint_second_slice_batch017_audit_adversarial.py"
      - "tools/validate_constraint_second_slice_batch018_population.py"
      - "tools/test_constraint_second_slice_batch018_population_adversarial.py"
      - "tools/validate_constraint_second_slice_batch019_facility_material_equipment.py"
      - "tools/test_constraint_second_slice_batch019_facility_material_equipment_adversarial.py"
      - "tools/validate_constraint_second_slice_batch020_policy_outcomes_cases.py"
      - "tools/test_constraint_second_slice_batch020_policy_outcomes_cases_adversarial.py"
      - "tools/validate_constraint_second_slice_batch021_beneficiary_substitution_power.py"
      - "tools/test_constraint_second_slice_batch021_beneficiary_substitution_power_adversarial.py"
      - "tools/validate_constraint_second_slice_batch022_tool_material_duplicate.py"
      - "tools/test_constraint_second_slice_batch022_tool_material_duplicate_adversarial.py"
      - "tools/validate_constraint_second_slice_batch023_hbm_yield_migration.py"
      - "tools/test_constraint_second_slice_batch023_hbm_yield_migration_adversarial.py"
      - "tools/validate_constraint_second_slice_batch024_acceptance_gate.py"
      - "tools/test_constraint_second_slice_batch024_acceptance_gate_adversarial.py"
      - ".github/workflows/constraint-second-slice.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Batch017 audit
        run: python tools/validate_constraint_second_slice_batch017_audit.py
      - name: Run Batch017 hostile matrix
        run: python tools/test_constraint_second_slice_batch017_audit_adversarial.py
      - name: Validate Batch018 first population
        run: python tools/validate_constraint_second_slice_batch018_population.py
      - name: Run Batch018 hostile matrix
        run: python tools/test_constraint_second_slice_batch018_population_adversarial.py
      - name: Validate Batch019 facility material equipment deepening
        run: python tools/validate_constraint_second_slice_batch019_facility_material_equipment.py
      - name: Run Batch019 hostile matrix
        run: python tools/test_constraint_second_slice_batch019_facility_material_equipment_adversarial.py
      - name: Validate Batch020 policy substitution outcome depth
        run: python tools/validate_constraint_second_slice_batch020_policy_outcomes_cases.py
      - name: Run Batch020 hostile matrix
        run: python tools/test_constraint_second_slice_batch020_policy_outcomes_cases_adversarial.py
      - name: Validate Batch021 beneficiary substitution power depth
        run: python tools/validate_constraint_second_slice_batch021_beneficiary_substitution_power.py
      - name: Run Batch021 hostile matrix
        run: python tools/test_constraint_second_slice_batch021_beneficiary_substitution_power_adversarial.py
      - name: Validate Batch022 tool material duplicate depth
        run: python tools/validate_constraint_second_slice_batch022_tool_material_duplicate.py
      - name: Run Batch022 hostile matrix
        run: python tools/test_constraint_second_slice_batch022_tool_material_duplicate_adversarial.py
      - name: Validate Batch023 HBM yield migration depth
        run: python tools/validate_constraint_second_slice_batch023_hbm_yield_migration.py
      - name: Run Batch023 hostile matrix
        run: python tools/test_constraint_second_slice_batch023_hbm_yield_migration_adversarial.py
      - name: Validate Batch024 strict acceptance gate
        run: python tools/validate_constraint_second_slice_batch024_acceptance_gate.py
      - name: Run Batch024 hostile matrix
        run: python tools/test_constraint_second_slice_batch024_acceptance_gate_adversarial.py
      - name: Validate Batch025 continuous cross-slice graph
        run: python tools/validate_constraint_second_slice_batch025_continuous_graph.py
      - name: Run Batch025 hostile matrix
        run: python tools/test_constraint_second_slice_batch025_continuous_graph_adversarial.py
