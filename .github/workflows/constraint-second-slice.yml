permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Batch017 audit
        run: python tools/validate_constraint_second_slice_batch017_audit.py
      - name: Run Batch017 hostile matrix
        run: python tools/test_constraint_second_slice_batch017_audit_adversarial.py
      - name: Validate Batch018 first population
        run: python tools/validate_constraint_second_slice_batch018_population.py
      - name: Run Batch018 hostile matrix
        run: python tools/test_constraint_second_slice_batch018_population_adversarial.py
      - name: Validate Batch019 facility material equipment deepening
        run: python tools/validate_constraint_second_slice_batch019_facility_material_equipment.py
      - name: Run Batch019 hostile matrix
        run: python tools/test_constraint_second_slice_batch019_facility_material_equipment_adversarial.py
      - name: Validate Batch020 policy substitution outcome depth
        run: python tools/validate_constraint_second_slice_batch020_policy_outcomes_cases.py
      - name: Run Batch020 hostile matrix
        run: python tools/test_constraint_second_slice_batch020_policy_outcomes_cases_adversarial.py
      - name: Validate Batch021 beneficiary substitution power depth
        run: python tools/validate_constraint_second_slice_batch021_beneficiary_substitution_power.py
      - name: Run Batch021 hostile matrix
        run: python tools/test_constraint_second_slice_batch021_beneficiary_substitution_power_adversarial.py
      - name: Validate Batch022 tool material duplicate depth
        run: python tools/validate_constraint_second_slice_batch022_tool_material_duplicate.py
      - name: Run Batch022 hostile matrix
        run: python tools/test_constraint_second_slice_batch022_tool_material_duplicate_adversarial.py
      - name: Validate Batch023 HBM yield migration depth
        run: python tools/validate_constraint_second_slice_batch023_hbm_yield_migration.py
      - name: Run Batch023 hostile matrix
        run: python tools/test_constraint_second_slice_batch023_hbm_yield_migration_adversarial.py
      - name: Validate Batch024 strict acceptance gate
        run: python tools/validate_constraint_second_slice_batch024_acceptance_gate.py
      - name: Run Batch024 hostile matrix
        run: python tools/test_constraint_second_slice_batch024_acceptance_gate_adversarial.py
      - name: Validate Batch025 continuous cross-slice graph
        run: python tools/validate_constraint_second_slice_batch025_continuous_graph.py
      - name: Run Batch025 hostile matrix
        run: python tools/test_constraint_second_slice_batch025_continuous_graph_adversarial.py
      - name: Validate Batch026 private T1 execution packet
        run: python tools/validate_constraint_second_slice_batch026_private_t1_packet.py
      - name: Run Batch026 hostile matrix
        run: python tools/test_constraint_second_slice_batch026_private_t1_packet_adversarial.py
      - name: Compile Batch026 local materializer and verifier
        run: python -m py_compile tools/materialize_constraint_second_slice_batch026_private_t1.py tools/verify_constraint_second_slice_batch026_private_t1.py

      - name: Validate Batch027 workstation launcher contract
        run: python tools/validate_constraint_second_slice_batch027_workstation_launcher.py

      - name: Run Batch027 hostile matrix
        run: python tools/test_constraint_second_slice_batch027_workstation_launcher_adversarial.py

      - name: Contract-check Batch027 PowerShell launcher
        shell: pwsh
        run: ./tools/Invoke-HydraConstraintSemiconductorBatch026PrivateT1.ps1 -Mode ContractCheck -RepoRoot "$PWD"

      - name: Compile Batch027 handback builder
        run: python -m py_compile tools/build_constraint_second_slice_batch026_private_t1_handback.py

      - name: Validate Batch028 browser acquisition adapter
        run: python tools/validate_constraint_second_slice_batch028_browser_adapter.py

      - name: Run Batch028 hostile matrix
        run: python tools/test_constraint_second_slice_batch028_browser_adapter_adversarial.py

      - name: Compile Batch028 browser runner
        run: python -m py_compile tools/private/HYDRA_CONSTRAINT_T1_SEMICONDUCTOR_BATCH026_BROWSER_CAPTURE_V001_20260927.py

      - name: Parse Batch028 PowerShell launcher
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "./tools/private/Invoke-HYDRAConstraintSemiconductorBatch026BrowserCapture_V001_20260927.ps1"),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Validate Batch029 Micron locator remediation
        run: python tools/validate_constraint_second_slice_batch029_locator_remediation.py

      - name: Run Batch029 hostile matrix
        run: python tools/test_constraint_second_slice_batch029_locator_remediation_adversarial.py

      - name: Compile Batch029 patched acquisition and T1 tools
        run: python -m py_compile tools/constraint_source_quarantine.py tools/private/HYDRA_CONSTRAINT_T1_SEMICONDUCTOR_BATCH026_BROWSER_CAPTURE_V001_20260927.py tools/materialize_constraint_second_slice_batch026_private_t1.py tools/verify_constraint_second_slice_batch026_private_t1.py tools/build_constraint_second_slice_batch026_private_t1_handback.py

      - name: Validate Batch029 runtime locator handoff
        run: python tools/test_constraint_second_slice_batch029_runtime_locator_handoff.py

      - name: Run retired Batch026 direct-entrypoint regressions
        run: python tools/test_constraint_second_slice_batch026_blocked_sources.py

      - name: Run Batch026 PDF raw-response regressions
        run: python tools/test_constraint_batch026_pdf_raw_response.py

      - name: Run Batch030 bounded TSMC browser-403 fallback regressions
        run: python tools/test_constraint_batch030_tsmc_browser_403_fallback.py

      - name: Validate Batch030 Micron quarantine
        run: python tools/validate_constraint_second_slice_batch030_micron_quarantine.py

      - name: Run Batch030 hostile matrix
        run: python tools/test_constraint_second_slice_batch030_micron_quarantine_adversarial.py

      - name: Run Batch030 raw-PDF transport regressions
        run: python tools/test_constraint_batch030_pdf_raw_response.py

      - name: Run Batch030 TSMC 403 response-stage regressions
        run: python tools/test_constraint_batch030_tsmc_403_response_stage.py

      - name: Compile Batch030 Micron-free acquisition and T1 tools
        run: python -m py_compile tools/private/HYDRA_CONSTRAINT_T1_SEMICONDUCTOR_BATCH030_BROWSER_CAPTURE_V001_20260927.py tools/materialize_constraint_second_slice_batch030_private_t1.py tools/verify_constraint_second_slice_batch030_private_t1.py tools/build_constraint_second_slice_batch030_private_t1_handback.py

      - name: Parse Batch030 PowerShell launcher
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "./tools/private/Invoke-HYDRAConstraintSemiconductorBatch030_V001_20260927.ps1"),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Validate Batch031 TSMC provider quarantine
        run: python tools/validate_constraint_second_slice_batch031_tsmc_quarantine.py

      - name: Run Batch031 TSMC quarantine hostile matrix
