name: Constraint policy integration

on:
  pull_request:
    paths:
      - "constraint-geopolitical-policy/**"
      - "constraint-physical-dependency/**"
      - "constraint-replay/**"
      - ".github/workflows/constraint-policy-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-physical-replay-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install stacked Constraint packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e ./constraint-physical-dependency -e ./constraint-replay -e ./constraint-geopolitical-policy
      - name: Compile packages
        run: |
          python -m compileall -q constraint-physical-dependency/src constraint-replay/src constraint-geopolitical-policy/src
      - name: Test physical foundation
        run: python -m pytest -q constraint-physical-dependency/tests
      - name: Test replay foundation
        run: python -m pytest -q constraint-replay/tests
      - name: Run Batch 015 classified replay E2E contract
        run: >-
          python constraint-replay/scripts/run_HYDRA_CONSTRAINT_BATCH015_classified_replay_e2e_20260926.py
          --check constraint-replay/runs/HYDRA_CONSTRAINT_BATCH015_CLASSIFIED_REPLAY_E2E_RUN_20260926.json
      - name: Test policy and cross-layer integration
        run: python -m unittest discover -s constraint-geopolitical-policy/tests -p "test_*.py" -v
