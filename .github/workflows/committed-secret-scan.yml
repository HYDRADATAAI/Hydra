name: Committed secret scan

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  committed-secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.0
          archive="gitleaks_${version}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl -fsSLo "$archive" "$url/$archive"
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  $archive" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          install -m 0755 gitleaks "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks" version

      - name: Verify scanner detects a synthetic credential
        shell: bash
        run: |
          set -euo pipefail
          fixture_dir="$(mktemp -d)"
          report="$RUNNER_TEMP/gitleaks-self-test.json"
          trap 'rm -rf "$fixture_dir" "$report"' EXIT
          python -c 'import secrets, string; print("ghp_" + "".join(secrets.choice(string.ascii_letters + string.digits) for _ in range(36)))' > "$fixture_dir/synthetic.txt"
          set +e
          "$RUNNER_TEMP/gitleaks" dir "$fixture_dir" --no-banner --redact --exit-code 1 --report-format json --report-path "$report" > /dev/null 2>&1
          status=$?
          set -e
          if [[ "$status" -ne 1 ]]; then
            echo "Gitleaks self-test did not detect the synthetic credential (status $status)."
            exit 1
          fi
          python - "$report" "$fixture_dir/synthetic.txt" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], encoding="utf-8") as report_file:
              findings = json.load(report_file)
          expected_file = os.path.realpath(sys.argv[2])
          assert any(
              item.get("RuleID") == "github-pat"
              and os.path.realpath(item.get("File", "")) == expected_file
              for item in findings
          ), "expected github-pat finding for synthetic fixture was not reported"
          PY
          echo "GITLEAKS_SELF_TEST=PASS"

      - name: Scan committed history without exposing secret values
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/gitleaks-findings.json"
          log="$RUNNER_TEMP/gitleaks.log"
          trap 'rm -f "$report" "$log"' EXIT
          set +e
          "$RUNNER_TEMP/gitleaks" git . --log-opts="--all" --no-banner --redact --exit-code 1 --report-format json --report-path "$report" > "$log" 2>&1
          status=$?
          set -e
          if [[ "$status" -eq 0 ]]; then
            echo "COMMITTED_SECRET_SCAN=PASS"
            exit 0
          fi
          if [[ "$status" -eq 1 && -s "$report" ]]; then
            python - "$report" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as report_file:
              findings = json.load(report_file)
          print(f"COMMITTED_SECRET_SCAN=FAIL findings={len(findings)}")
          for finding in findings:
              print(json.dumps({
                  "path": finding.get("File", "<unknown>"),
                  "line": finding.get("StartLine", "?"),
                  "rule": finding.get("RuleID", "unknown"),
                  "commit": finding.get("Commit", "unknown"),
              }, ensure_ascii=True))
          PY
            exit 1
          fi
          echo "Gitleaks failed before producing a valid report (status $status)."
          exit 1