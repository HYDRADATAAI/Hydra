name: Constraint semiconductor source intake

on:
  pull_request:
    paths:
      - "docs/constraint/second_slice/**"
      - "tools/*semiconductor*"
      - "constraint-t1-raw-artifact-store/**"
      - ".github/workflows/constraint-semiconductor-source-intake.yml"
  push:
    branches: [main]
    paths:
      - "docs/constraint/second_slice/**"
      - "tools/*semiconductor*"
      - "constraint-t1-raw-artifact-store/**"
      - ".github/workflows/constraint-semiconductor-source-intake.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Validate reviewed source seed
        run: python tools/validate_constraint_semiconductor_pass004_source_seed.py
      - name: Reject seed promotion and lookahead mutations
        run: python tools/test_constraint_semiconductor_pass004_source_seed.py
      - name: Verify private T1 receipt intake
        run: python tools/test_hydra_constraint_semiconductor_pass006_capture_intake.py
