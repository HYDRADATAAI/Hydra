[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hydra-constraint-replay"
version = "0.1.0"
description = "Fail-closed point-in-time replay and historical outcome evaluation for HYDRA Constraint"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
